global:
  resolve_timeout: 5m

route:
  receiver: "demo-notifications"
  group_by: ["alertname", "severity"]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 2h

receivers:
  # This empty receiver allows the stack to start without exposing personal credentials.
  # Configure email_configs or slack_configs below to enable real notifications.
  - name: "demo-notifications"
